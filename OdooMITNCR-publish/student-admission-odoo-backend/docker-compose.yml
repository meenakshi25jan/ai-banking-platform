# Student Admission Odoo Backend

services:
  db:
    image: postgres:15-alpine
    container_name: student-admission-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-odoo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-odoo}
    volumes:
      - odoo-db-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-odoo} -d ${POSTGRES_DB:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  odoo:
    build:
      context: .
      dockerfile: deployment/Dockerfile
    container_name: student-admission-odoo
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8069:8069"
    environment:
      HOST: db
      PORT: 5432
      ODOO_DB_USER: ${ODOO_DB_USER:-odoo}
      PASSWORD: ${POSTGRES_PASSWORD:-odoo}
      ODOO_DATABASE: ${ODOO_DATABASE:-student_admission}
      STUDENT_ADMISSION_CORS_ORIGINS: ${STUDENT_ADMISSION_CORS_ORIGINS:-http://localhost:3000,https://*.vercel.app}
    volumes:
      - odoo-web-data:/var/lib/odoo
      - ./student_admission:/mnt/extra-addons/student_admission:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8069/api/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s

volumes:
  odoo-db-data:
  odoo-web-data:
