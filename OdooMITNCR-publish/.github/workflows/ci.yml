name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  portal:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: student-admission-portal-vercel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: student-admission-portal-vercel/package-lock.json
      - run: npm ci && npm run build && npm test

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci && npm test
        env:
          JWT_SECRET: test-secret
          MONGODB_URI: mongodb://localhost:27017/test
