name: Student Admission Portal - CI

on:
  push:
    paths: ['student-portal/**']
  pull_request:
    paths: ['student-portal/**']

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: student-portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: student-portal/package-lock.json
      - name: Install dependencies
        run: npm install
      - name: Lint
        run: npm run lint || true
      - name: Test
        run: npm test -- --passWithNoTests
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_ODOO_URL: http://localhost:8069
          NEXT_PUBLIC_ODOO_DB: student_admission
